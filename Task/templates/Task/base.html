{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A focused task manager with lists, a Kanban board, due dates and priorities.">
  <title>{% block title %}Task manager{% endblock %} · To-Do</title>

  <link rel="icon" type="image/png" href="{% static 'assets/images/to-do-list.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
        integrity="sha384-nWN3KqaaVcbEsCjLSV+2jMjh62Iny/+mN3srM8TZeM8N6aj7eDl5wwYggjAJ4/sJ" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">

  <a class="visually-hidden-focusable skip-link" href="#main">Skip to content</a>

  {% block body %}{% endblock %}

  <!-- Notifications (server messages + ones added by script.js) -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-area">
    {% for message in messages %}
    <div class="toast app-toast align-items-center border-0" role="status" aria-live="polite" aria-atomic="true" data-bs-delay="3500">
      <div class="d-flex align-items-center">
        <div class="toast-body d-flex align-items-center gap-2">
          <i class="bi {% if message.tags == 'error' %}bi-x-circle-fill text-danger{% else %}bi-check-circle-fill text-success{% endif %}"></i>
          {{ message }}
        </div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
    {% endfor %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="{% static 'js/script.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
