{% extends 'Task/base.html' %}

{% block content %}

<div class="container bg-dark text-info p-5 form-layout">
    <h3>Delete Task</h3>
    <hr>
    <p class="text-light">Are you sure you want to delete <strong>Task-{{ task.task_number }}: {{ task.name }}</strong>? This cannot be undone.</p>
    <form method="POST">
        {% csrf_token %}
        <div class="d-inline-flex">
            <button type="submit" class="btn btn-danger">
                Delete &nbsp;<i class="fa-solid fa-trash"></i>
            </button>
            &nbsp;&nbsp;&nbsp;
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                Cancel &nbsp;<i class="fa-solid fa-arrow-left"></i>
            </a>
        </div>
    </form>
</div>
<br>

{% endblock %}
